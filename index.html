<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Academia de Barritas Salutari e Redditizie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#00e64d;
  --green-dark:#00b53d;
  --black:#0a0a0a;
  --bg1:#0d0f0d;
  --bg2:#141714;
  --card:#1a1d1a;
  --card-border:#262a26;
  --text:#f2f2f2;
  --text-dim:#9aa39a;
  --danger:#ff5c5c;
  --gold:#ffd166;
  --radius:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg1);
  color:var(--text);
  font-family:'Inter',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{font-family:'Poppins',sans-serif;}
button{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--card-border);border-radius:10px;}

/* ---------- App shell ---------- */
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:86px;background:
  radial-gradient(circle at 20% 0%, rgba(0,230,77,0.08), transparent 40%),
  var(--bg1);
}
.screen{display:none;animation:fadeIn .35s ease;}
.screen.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ---------- Top bar ---------- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(13,15,13,0.92);
  backdrop-filter:blur(10px);
  padding:16px 18px 14px;
  border-bottom:1px solid var(--card-border);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand-mini{display:flex;align-items:center;gap:8px;}
.brand-dot{width:10px;height:10px;border-radius:3px;background:var(--green);box-shadow:0 0 12px var(--green);}
.brand-mini span{font-family:'Poppins';font-weight:700;font-size:13px;letter-spacing:0.5px;color:var(--text-dim);}
.page-title{font-size:22px;font-weight:800;margin:10px 0 0;}
.page-sub{color:var(--text-dim);font-size:13px;margin-top:2px;}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--green);color:#04140a;border:none;
  font-weight:700;font-size:15px;
  padding:15px 20px;border-radius:14px;
  cursor:pointer;transition:transform .15s ease, box-shadow .15s ease;
  box-shadow:0 6px 18px rgba(0,230,77,0.25);
  width:100%;
}
.btn:active{transform:scale(0.97);}
.btn-outline{
  background:transparent;color:var(--green);border:1.5px solid var(--green);
  box-shadow:none;
}
.btn-ghost{
  background:var(--card);color:var(--text);border:1px solid var(--card-border);
  box-shadow:none;font-weight:600;
}
.btn-sm{padding:10px 14px;font-size:13px;border-radius:10px;width:auto;}
.btn-block{width:100%;}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 6px 18px rgba(255,92,92,0.25);}

/* ---------- Cards ---------- */
.card{
  background:var(--card);
  border:1px solid var(--card-border);
  border-radius:var(--radius);
  padding:18px;
}
.section{padding:18px;}
.section-title{font-size:18px;font-weight:800;margin:22px 0 12px;display:flex;align-items:center;gap:8px;}
.section-title .accent{width:4px;height:18px;background:var(--green);border-radius:3px;display:inline-block;}

/* ---------- Bottom nav ---------- */
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;
  max-width:520px;margin:0 auto;
  background:rgba(17,20,17,0.97);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--card-border);
  display:flex;justify-content:space-around;align-items:center;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:100;
}
.nav-item{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  background:none;border:none;color:var(--text-dim);
  font-size:10px;font-weight:600;padding:6px 4px;cursor:pointer;flex:1;
  transition:color .2s;
}
.nav-item svg{width:21px;height:21px;stroke:var(--text-dim);transition:stroke .2s;fill:none;}
.nav-item.active{color:var(--green);}
.nav-item.active svg{stroke:var(--green);}

/* ---------- Welcome screen ---------- */
.welcome-wrap{
  min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:40px 26px;text-align:center;position:relative;overflow:hidden;
}
.welcome-glow{
  position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:340px;height:340px;border-radius:50%;
  background:radial-gradient(circle, rgba(0,230,77,0.25), transparent 70%);
  filter:blur(20px);
}
.logo-badge{
  width:88px;height:88px;border-radius:24px;
  background:linear-gradient(145deg, var(--green), var(--green-dark));
  display:flex;align-items:center;justify-content:center;
  font-size:40px;margin-bottom:22px;position:relative;z-index:2;
  box-shadow:0 10px 30px rgba(0,230,77,0.35);
  animation:pop .6s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop{from{transform:scale(0.5);opacity:0;}to{transform:scale(1);opacity:1;}}
.welcome-title{
  font-size:30px;font-weight:800;line-height:1.15;margin:0 0 8px;position:relative;z-index:2;
}
.welcome-title em{color:var(--green);font-style:normal;}
.welcome-sub{color:var(--text-dim);font-size:14.5px;line-height:1.5;max-width:340px;margin:0 0 30px;position:relative;z-index:2;}
.welcome-author{
  display:flex;align-items:center;gap:8px;color:var(--text-dim);font-size:12.5px;
  margin-bottom:34px;position:relative;z-index:2;
}
.welcome-author b{color:var(--text);}
.welcome-cta{width:100%;max-width:300px;position:relative;z-index:2;}
.welcome-features{
  display:flex;gap:18px;margin-top:30px;position:relative;z-index:2;flex-wrap:wrap;justify-content:center;
}
.wf-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-dim);font-size:11px;}
.wf-item .n{color:var(--green);font-weight:800;font-size:18px;font-family:'Poppins';}

/* ---------- Home grid ---------- */
.home-hero{
  margin:18px 18px 6px;padding:20px;border-radius:20px;
  background:linear-gradient(135deg, rgba(0,230,77,0.16), rgba(0,230,77,0.02));
  border:1px solid rgba(0,230,77,0.25);
}
.home-hero h2{margin:0 0 6px;font-size:19px;font-weight:800;}
.home-hero p{margin:0;color:var(--text-dim);font-size:13px;line-height:1.5;}
.progress-bar-wrap{margin-top:14px;}
.progress-track{
  height:8px;background:rgba(255,255,255,0.08);border-radius:8px;overflow:hidden;
}
.progress-fill{height:100%;background:linear-gradient(90deg, var(--green-dark), var(--green));border-radius:8px;transition:width .4s ease;}
.progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-top:6px;}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px;}
.grid-tool{
  background:var(--card);border:1px solid var(--card-border);border-radius:16px;
  padding:16px 14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;
  transition:transform .15s, border-color .15s;
}
.grid-tool:active{transform:scale(0.96);}
.grid-tool .icon{font-size:24px;}
.grid-tool .label{font-weight:700;font-size:13.5px;}
.grid-tool .desc{font-size:11px;color:var(--text-dim);line-height:1.4;}

/* ---------- Category cards (no carousel, per spec) ---------- */
.cat-grid{display:flex;flex-direction:column;gap:12px;padding:0 18px;}
.cat-card{
  position:relative;border-radius:18px;overflow:hidden;
  background:var(--card);border:1px solid var(--card-border);
  padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;
  transition:transform .15s, border-color .15s;
}
.cat-card:active{transform:scale(0.98);}
.cat-card .emoji{
  width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;
  font-size:26px;flex-shrink:0;
}
.cat-card .info{flex:1;min-width:0;}
.cat-card .info h3{margin:0 0 3px;font-size:15.5px;font-weight:800;}
.cat-card .info p{margin:0;font-size:12px;color:var(--text-dim);}
.cat-card .count{
  font-size:11px;font-weight:700;color:var(--green);
  background:rgba(0,230,77,0.12);padding:4px 10px;border-radius:20px;white-space:nowrap;
}

/* ---------- Recipe cards (expandable) ---------- */
.search-bar{
  margin:14px 18px;display:flex;align-items:center;gap:10px;
  background:var(--card);border:1px solid var(--card-border);border-radius:14px;
  padding:13px 14px;
}
.search-bar input{
  background:none;border:none;outline:none;color:var(--text);font-size:14.5px;flex:1;font-family:'Inter';
}
.search-bar input::placeholder{color:var(--text-dim);}
.search-bar svg{width:18px;height:18px;stroke:var(--text-dim);flex-shrink:0;}

.filter-chips{display:flex;gap:8px;padding:0 18px 14px;overflow-x:auto;}
.chip{
  flex-shrink:0;padding:8px 14px;border-radius:20px;border:1px solid var(--card-border);
  background:var(--card);color:var(--text-dim);font-size:12.5px;font-weight:600;cursor:pointer;
  white-space:nowrap;transition:all .15s;
}
.chip.active{background:var(--green);color:#04140a;border-color:var(--green);}

.recipe-list{display:flex;flex-direction:column;gap:10px;padding:0 18px 18px;}
.recipe-card{
  background:var(--card);border:1px solid var(--card-border);border-radius:16px;overflow:hidden;
}
.recipe-head{
  display:flex;align-items:center;gap:12px;padding:14px;cursor:pointer;
}
.recipe-thumb{
  width:48px;height:48px;border-radius:12px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.recipe-info{flex:1;min-width:0;}
.recipe-info h4{margin:0 0 3px;font-size:14.5px;font-weight:700;}
.recipe-info p{margin:0;font-size:11.5px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.recipe-meta{display:flex;gap:6px;margin-top:5px;}
.tag{font-size:9.5px;font-weight:700;padding:2px 7px;border-radius:8px;background:rgba(255,255,255,0.06);color:var(--text-dim);}
.tag.no-horno{color:var(--green);background:rgba(0,230,77,0.1);}
.tag.horno{color:var(--gold);background:rgba(255,209,102,0.12);}
.fav-btn{
  background:none;border:none;cursor:pointer;flex-shrink:0;padding:6px;
}
.fav-btn svg{width:21px;height:21px;stroke:var(--text-dim);fill:none;transition:all .2s;}
.fav-btn.active svg{fill:var(--green);stroke:var(--green);}
.chevron{width:18px;height:18px;stroke:var(--text-dim);flex-shrink:0;transition:transform .25s;}
.recipe-card.open .chevron{transform:rotate(180deg);}

.recipe-body{
  max-height:0;overflow:hidden;transition:max-height .35s ease;
}
.recipe-card.open .recipe-body{max-height:2000px;}
.recipe-body-inner{padding:0 16px 18px;border-top:1px solid var(--card-border);padding-top:14px;}
.recipe-body-inner h5{
  font-size:12px;text-transform:uppercase;letter-spacing:0.6px;color:var(--green);margin:14px 0 8px;font-weight:700;
}
.recipe-body-inner h5:first-child{margin-top:0;}
.ing-list{list-style:none;margin:0;padding:0;}
.ing-list li{
  padding:8px 0;border-bottom:1px solid var(--card-border);font-size:13.5px;display:flex;gap:8px;
}
.ing-list li:last-child{border-bottom:none;}
.ing-list li::before{content:"●";color:var(--green);font-size:7px;margin-top:6px;}
.steps-list{list-style:none;margin:0;padding:0;counter-reset:step;}
.steps-list li{
  padding:10px 0;border-bottom:1px solid var(--card-border);font-size:13.5px;line-height:1.55;
  display:flex;gap:10px;counter-increment:step;
}
.steps-list li:last-child{border-bottom:none;}
.steps-list li::before{
  content:counter(step);flex-shrink:0;width:22px;height:22px;border-radius:7px;
  background:rgba(0,230,77,0.14);color:var(--green);font-weight:800;font-size:11.5px;
  display:flex;align-items:center;justify-content:center;margin-top:1px;
}
.steps-list b{color:var(--text);}

/* ---------- Forms / calculators ---------- */
.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bg2);border:1px solid var(--card-border);border-radius:12px;
  padding:13px 14px;color:var(--text);font-size:15px;outline:none;font-family:'Inter';
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--green);}
.field textarea{resize:vertical;min-height:70px;}
.input-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.ingredient-row{
  display:flex;gap:8px;align-items:center;margin-bottom:8px;
}
.ingredient-row input{flex:1;min-width:0;}
.ingredient-row input.qty{flex:0 0 84px;min-width:0;}
.remove-row{
  background:rgba(255,92,92,0.12);border:none;color:var(--danger);width:38px;height:38px;
  border-radius:10px;flex-shrink:0;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
}

.result-box{
  margin-top:18px;padding:18px;border-radius:16px;
  background:linear-gradient(135deg, rgba(0,230,77,0.14), rgba(0,230,77,0.02));
  border:1px solid rgba(0,230,77,0.3);
}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,0.08);font-size:13.5px;}
.result-row:last-child{border-bottom:none;}
.result-row .v{font-weight:800;font-family:'Poppins';}
.result-big{text-align:center;margin:6px 0 14px;}
.result-big .n{font-size:34px;font-weight:800;color:var(--green);font-family:'Poppins';}
.result-big .l{font-size:12px;color:var(--text-dim);margin-top:2px;}

/* ---------- Checklist / shopping list ---------- */
.check-item{
  display:flex;align-items:center;gap:12px;padding:14px;background:var(--card);
  border:1px solid var(--card-border);border-radius:14px;margin-bottom:9px;cursor:pointer;
}
.check-box{
  width:24px;height:24px;border-radius:8px;border:2px solid var(--card-border);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.check-item.done .check-box{background:var(--green);border-color:var(--green);}
.check-box svg{width:14px;height:14px;stroke:#04140a;opacity:0;transition:opacity .2s;}
.check-item.done .check-box svg{opacity:1;}
.check-item span{flex:1;font-size:14.5px;}
.check-item.done span{color:var(--text-dim);text-decoration:line-through;}
.check-item .del{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;padding:4px;}

.add-bar{display:flex;gap:8px;padding:0 18px 14px;}
.add-bar input{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:13px 14px;color:var(--text);font-size:14.5px;outline:none;}
.add-bar input:focus{border-color:var(--green);}
.add-bar button{
  background:var(--green);border:none;color:#04140a;width:48px;border-radius:12px;font-size:22px;font-weight:700;cursor:pointer;flex-shrink:0;
}

/* ---------- Diary ---------- */
.diary-entry{background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px;margin-bottom:10px;}
.diary-entry .de-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.diary-entry .de-date{font-size:11px;color:var(--green);font-weight:700;}
.diary-entry .de-title{font-weight:700;font-size:14.5px;margin:2px 0 4px;}
.diary-entry .de-text{font-size:13px;color:var(--text-dim);line-height:1.5;white-space:pre-wrap;}
.diary-entry .del{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:16px;}

/* ---------- Achievements ---------- */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px;}
.ach-card{
  background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:16px;text-align:center;
  opacity:0.4;transition:all .3s;
}
.ach-card.unlocked{opacity:1;border-color:rgba(0,230,77,0.4);background:linear-gradient(150deg, rgba(0,230,77,0.1), var(--card));}
.ach-card .ai{font-size:30px;margin-bottom:8px;}
.ach-card .at{font-size:12.5px;font-weight:700;margin-bottom:3px;}
.ach-card .ad{font-size:10.5px;color:var(--text-dim);line-height:1.4;}

/* ---------- Generic content blocks (ventas/conservacion/empaque) ---------- */
.info-block{background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:18px;margin:0 18px 14px;}
.info-block h3{margin:0 0 8px;font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:8px;}
.info-block p{margin:0 0 10px;font-size:13.5px;color:var(--text-dim);line-height:1.6;}
.info-block ul{margin:0;padding-left:0;list-style:none;}
.info-block ul li{font-size:13.5px;line-height:1.6;padding:6px 0 6px 22px;position:relative;color:var(--text);}
.info-block ul li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:800;}
.info-block .quote{
  margin-top:12px;padding:12px 14px;border-left:3px solid var(--green);background:rgba(0,230,77,0.06);
  border-radius:0 10px 10px 0;font-size:13px;font-weight:600;color:var(--text);
}

.subtab-row{display:flex;gap:8px;padding:14px 18px 4px;overflow-x:auto;}
.subtab{
  flex-shrink:0;padding:9px 16px;border-radius:12px;background:var(--card);border:1px solid var(--card-border);
  font-size:12.5px;font-weight:700;color:var(--text-dim);cursor:pointer;white-space:nowrap;
}
.subtab.active{background:var(--green);color:#04140a;border-color:var(--green);}

/* ---------- Empty state ---------- */
.empty-state{text-align:center;padding:50px 24px;color:var(--text-dim);}
.empty-state .e-icon{font-size:42px;margin-bottom:12px;opacity:0.6;}
.empty-state p{font-size:13.5px;line-height:1.5;margin:0;}

/* ---------- Contact ---------- */
.contact-card{
  display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--card-border);
  border-radius:16px;padding:16px;margin:0 18px 12px;cursor:pointer;transition:transform .15s;
}
.contact-card:active{transform:scale(0.97);}
.contact-icon{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.contact-card .ct{flex:1;}
.contact-card .ct h4{margin:0 0 2px;font-size:14.5px;font-weight:700;}
.contact-card .ct p{margin:0;font-size:12px;color:var(--text-dim);}

/* ---------- Toast ---------- */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--green);color:#04140a;padding:12px 22px;border-radius:30px;
  font-weight:700;font-size:13.5px;z-index:200;opacity:0;transition:all .3s;
  box-shadow:0 8px 24px rgba(0,230,77,0.4);pointer-events:none;white-space:nowrap;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- Header back ---------- */
.back-row{display:flex;align-items:center;gap:10px;}
.back-btn{
  background:var(--card);border:1px solid var(--card-border);width:36px;height:36px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
}
.back-btn svg{width:18px;height:18px;stroke:var(--text);}

/* ---------- Misc ---------- */
.mt0{margin-top:0;}
.text-center{text-align:center;}
.spacer{height:14px;}
.badge-new{font-size:10px;background:var(--gold);color:#3a2900;padding:2px 8px;border-radius:8px;font-weight:800;margin-left:6px;}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
window.STORAGE_OK = true;
try{ localStorage.setItem('__test__','1'); localStorage.removeItem('__test__'); }catch(e){ window.STORAGE_OK = false; }

function loadLS(key, fallback){
  try{
    var v = localStorage.getItem(key);
    return v ? JSON.parse(v) : fallback;
  }catch(e){ return fallback; }
}
function saveLS(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }catch(e){}
}

/* =========================================================
   DATOS: RECETAS (contenido real del ebook)

  saveLS('br_it_checklist', STATE.checklist);

  saveLS('br_it_sections', STATE.visitedSections);

function showToast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function unlockAchievement(id){
  if(STATE.achievements.indexOf(id) === -1){
    STATE.achievements.push(id);
    persistAll();
    var def = ACHIEVEMENTS_DEF.find(function(a){return a.id===id;});
    if(def) showToast('🏆 Traguardo sbloccato: ' + def.title);
  }
}

function markSectionVisited(name){
  if(STATE.visitedSections.indexOf(name) === -1){
    STATE.visitedSections.push(name);
    persistAll();
    var allTabs = ['home','recetas','calculadoras','herramientas','perfil'];
    if(allTabs.every(function(t){return STATE.visitedSections.indexOf(t)!==-1;})){
      unlockAchievement('explorer');
    }
  }
}

function calcProgress(){
  var doneCount = STATE.checklist.filter(function(c){return c.done;}).length;
  var checklistPct = (doneCount / STATE.checklist.length) * 100;
  var recipesPct = (STATE.openedRecipes.length / RECIPES.length) * 100;
  return Math.round((checklistPct*0.5) + (recipesPct*0.5));
}

function render(){
  var app = document.getElementById('app');
  var html = '';

  if(STATE.screen === 'welcome'){
    html = renderWelcome();
    app.innerHTML = html;
    bindWelcome();
    return;
  }

  html += renderTopBar();
  html += '<div class="screens-wrap">';
  html += renderScreenContent();
  html += '</div>';
  html += renderBottomNav();
  app.innerHTML = html;
  bindGlobalEvents();
}

function renderWelcome(){
  return '\
  <div class="welcome-wrap">\
    <div class="welcome-glow"></div>\
    <div class="logo-badge">🍫</div>\
    <h1 class="welcome-title">Academia de Barritas<br><em>Salutari</em><br>e Redditizie</h1>\
    <p class="welcome-sub">Impara 33 ricette virali, calcola i tuoi costi e trasforma le tue barrette in un business vero. Di Elena Ugarte — Finanzas Reales.</p>\
    <div class="welcome-author">🎬 <b>Finanzas Reales</b> · @elensaborami</div>\
    <button class="btn welcome-cta" id="btnStart">Inizia ora →</button>\
    <div class="welcome-features">\
      <div class="wf-item"><span class="n">33</span>Ricette</div>\
      <div class="wf-item"><span class="n">3</span>Calcolatrici</div>\
      <div class="wf-item"><span class="n">100%</span>Offline</div>\
    </div>\
  </div>';
}

function bindWelcome(){
  document.getElementById('btnStart').onclick = function(){
    STATE.screen = 'home';

}

function renderTopBar(){
  var titles = {

function renderBottomNav(){
  var tabs = [
    {id:'home', icon:ICONS.home, label:'Home'},
    {id:'recetas', icon:ICONS.book, label:'Ricette'},
    {id:'calculadoras', icon:ICONS.calc, label:'Calcola'},
    {id:'herramientas', icon:ICONS.tools, label:'Strumenti'},

  ];

function renderScreenContent(){
  markSectionVisited(STATE.tab);
  switch(STATE.tab){
    case 'home': return renderHome();
    case 'recetas': return renderRecetas();
    case 'calculadoras': return renderCalculadoras();
    case 'herramientas': return renderHerramientas();
    case 'perfil': return renderPerfil();

  }
}

/* ---------------- RECETAS ---------------- */
function renderRecetas(){
  var html = '';
  html += '<div class="search-bar">'+ICONS.search+'<input type="text" id="searchInput" placeholder="Cerca ricetta o ingrediente..." value="'+escapeHtml(STATE.searchQuery)+'"></div>';
  html += '<div class="filter-chips">';
  html += '<div class="chip '+(STATE.recipeFilter==='all'?'active':'')+'" data-filter="all">Tutte (33)</div>';
  html += '<div class="chip '+(STATE.recipeFilter==='sin-horno'?'active':'')+'" data-filter="sin-horno">🔥 Senza forno</div>';
  html += '<div class="chip '+(STATE.recipeFilter==='horno'?'active':'')+'" data-filter="horno">🔆 Al forno</div>';
  html += '<div class="chip '+(STATE.recipeFilter==='favs'?'active':'')+'" data-filter="favs">⭐ Preferite</div>';
  html += '</div>';

  var filtered = RECIPES.filter(function(r){
    var matchSearch = true;
    if(STATE.searchQuery.trim().length>0){
      var q = STATE.searchQuery.toLowerCase();
      var hay = r.name.toLowerCase().indexOf(q)!==-1 || r.ing.some(function(i){return i.toLowerCase().indexOf(q)!==-1;});
      matchSearch = hay;
    }
    var matchFilter = true;
    if(STATE.recipeFilter==='sin-horno') matchFilter = r.cat==='sin-horno';
    else if(STATE.recipeFilter==='horno') matchFilter = r.cat==='horno';
    else if(STATE.recipeFilter==='favs') matchFilter = STATE.favorites.indexOf(r.id)!==-1;
    return matchSearch && matchFilter;
  });

  html += '<div class="recipe-list">';
  if(filtered.length===0){
    html += '<div class="empty-state"><div class="e-icon">🔍</div><p>Non abbiamo trovato ricette con questi filtri.<br>Prova con un\'altra ricerca.</p></div>';
  } else {
    filtered.forEach(function(r){
      var isOpen = STATE.openRecipeId === r.id;
      var isFav = STATE.favorites.indexOf(r.id)!==-1;
      html += '<div class="recipe-card '+(isOpen?'open':'')+'" data-recipe-id="'+r.id+'">';
      html += '  <div class="recipe-head" data-toggle-recipe="'+r.id+'">';
      html += '    <div class="recipe-thumb" style="background:'+r.color+'">'+r.emoji+'</div>';
      html += '    <div class="recipe-info"><h4>'+r.name+'</h4><p>'+r.desc+'</p>';
      html += '      <div class="recipe-meta"><span class="tag '+(r.cat==='horno'?'horno':'no-horno')+'">'+(r.cat==='horno'?'🔆 Al forno':'🔥 Senza forno')+'</span></div>';
      html += '    </div>';
      html += '    <button class="fav-btn '+(isFav?'active':'')+'" data-fav-id="'+r.id+'">'+ICONS.heart+'</button>';
      html += '    <span class="chevron">'+ICONS.chevron+'</span>';
      html += '  </div>';
      html += '  <div class="recipe-body"><div class="recipe-body-inner">';
      html += '    <h5>Ingredienti</h5><ul class="ing-list">'+r.ing.map(function(i){return '<li>'+i+'</li>';}).join('')+'</ul>';
      html += '    <h5>Preparazione</h5><ol class="steps-list">'+r.steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol>';
      html += '  </div></div>';
      html += '</div>';
    });
  }
  html += '</div>';
  return html;
}

function renderTabbedInfo(data, activeIdx, prefix){
  var html = '<div class="subtab-row">';
  data.forEach(function(item,idx){
    html += '<div class="subtab '+(activeIdx===idx?'active':'')+'" data-info-tab="'+prefix+':'+idx+'">'+item.icon+' '+(idx+1)+'</div>';
  });
  html += '</div>';
  var item = data[activeIdx] || data[0];
  html += '<div class="info-block"><h3>'+item.icon+' '+item.title+'</h3><p>'+item.text+'</p>';
  if(item.list && item.list.length>0){
    html += '<ul>'+item.list.map(function(l){return '<li>'+l+'</li>';}).join('')+'</ul>';
  }
  if(item.quote){
    html += '<div class="quote">'+item.quote+'</div>';
  }
  html += '</div>';
  return html;
}

function escapeHtml(str){
  if(!str) return '';
  var d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

/* =========================================================
   EVENTOS
========================================================= */
function bindGlobalEvents(){
  // Bottom nav
  document.querySelectorAll('.nav-item').forEach(function(btn){
    btn.onclick = function(){
      STATE.tab = btn.getAttribute('data-tab');
      STATE.openRecipeId = null;
      render();
      window.scrollTo(0,0);
    };
  });

  // Home: grid tools shortcuts
  document.querySelectorAll('[data-action]').forEach(function(el){
    el.onclick = function(){
      var act = el.getAttribute('data-action');
      if(act==='goto-calc-costos'){ STATE.tab='calculadoras'; STATE.calcSub=null; }
      else if(act==='goto-calc-precio'){ STATE.tab='calculadoras'; STATE.calcSub='precio'; }
      else if(act==='goto-checklist'){ STATE.tab='herramientas'; STATE.herrSub='checklist'; }
      else if(act==='goto-shopping'){ STATE.tab='herramientas'; STATE.herrSub='shopping'; }
      render(); window.scrollTo(0,0);
    };
  });

  // Home: category cards -> go to recetas filtered
  document.querySelectorAll('[data-cat-filter]').forEach(function(el){
    el.onclick = function(){
      STATE.tab = 'recetas';
      STATE.recipeFilter = el.getAttribute('data-cat-filter');
      render(); window.scrollTo(0,0);
    };
  });

  // Recetas: search
  var searchInput = document.getElementById('searchInput');
  if(searchInput){
    searchInput.oninput = function(){
      STATE.searchQuery = searchInput.value;
      var pos = searchInput.selectionStart;
      render();
      var ni = document.getElementById('searchInput');
      if(ni){ ni.focus(); ni.setSelectionRange(pos,pos); }
    };
  }

  // Recetas: filter chips
  document.querySelectorAll('[data-filter]').forEach(function(el){
    el.onclick = function(){
      STATE.recipeFilter = el.getAttribute('data-filter');
      render();
    };
  });

  // Recetas: toggle open
  document.querySelectorAll('[data-toggle-recipe]').forEach(function(el){
    el.onclick = function(e){
      if(e.target.closest('[data-fav-id]')) return;
      var id = parseInt(el.getAttribute('data-toggle-recipe'));
      STATE.openRecipeId = (STATE.openRecipeId === id) ? null : id;
      if(STATE.openRecipeId === id){
        if(STATE.openedRecipes.indexOf(id)===-1){
          STATE.openedRecipes.push(id);
          persistAll();
          unlockAchievement('first_recipe');
          if(STATE.openedRecipes.length >= RECIPES.length) unlockAchievement('allrecipes');
        }
      }
      render();
    };
  });

  // Recetas: favorite toggle
  document.querySelectorAll('[data-fav-id]').forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      var id = parseInt(el.getAttribute('data-fav-id'));
      var idx = STATE.favorites.indexOf(id);
      if(idx===-1){
        STATE.favorites.push(id);
        showToast('⭐ Aggiunta ai preferiti');
        if(STATE.favorites.length>=5) unlockAchievement('fav5');
      } else {
        STATE.favorites.splice(idx,1);
      }
      persistAll();
      render();
    };
  });

  // Calculadoras: subtabs
  document.querySelectorAll('[data-calc-sub]').forEach(function(el){
    el.onclick = function(){
      STATE.calcSub = el.getAttribute('data-calc-sub');
      render();
    };
  });

  // Calc costos: rows
  var addCostRow = document.getElementById('addCostRow');
  if(addCostRow){
    addCostRow.onclick = function(){
      STATE.costIngredients.push({name:'',qty:''});
      render();
    };
  }
  document.querySelectorAll('[data-cost-name]').forEach(function(el){
    el.oninput = function(){ STATE.costIngredients[parseInt(el.getAttribute('data-cost-name'))].name = el.value; };
  });
  document.querySelectorAll('[data-cost-qty]').forEach(function(el){
    el.oninput = function(){ STATE.costIngredients[parseInt(el.getAttribute('data-cost-qty'))].qty = el.value; };
  });
  document.querySelectorAll('[data-remove-cost]').forEach(function(el){
    el.onclick = function(){
      var idx = parseInt(el.getAttribute('data-remove-cost'));
      STATE.costIngredients.splice(idx,1);
      if(STATE.costIngredients.length===0) STATE.costIngredients.push({name:'',qty:''});
      render();
    };
  });
  var costUnitsInput = document.getElementById('costUnits');
  if(costUnitsInput) costUnitsInput.oninput = function(){ STATE.costUnits = costUnitsInput.value; };

  var calcCostosBtn = document.getElementById('calcCostosBtn');
  if(calcCostosBtn){
    calcCostosBtn.onclick = function(){
      var total = STATE.costIngredients.reduce(function(sum,row){
        var v = parseFloat(row.qty);
        return sum + (isNaN(v)?0:v);
      },0);
      var units = parseFloat(STATE.costUnits) || 1;
      if(units<=0) units = 1;
      var perUnit = (total/units).toFixed(2);
      STATE.costResult = {total: total.toFixed(2), units: units, perUnit: perUnit};
      unlockAchievement('first_calc');
      render();
    };
  }

  // Calc precio
  var calcPrecioBtn = document.getElementById('calcPrecioBtn');
  if(calcPrecioBtn){
    var pc = document.getElementById('precioCosto');
    var pm = document.getElementById('precioMargen');
    if(pc) pc.oninput = function(){ STATE.precioCosto = pc.value; };
    if(pm) pm.oninput = function(){ STATE.precioMargen = pm.value; };
    calcPrecioBtn.onclick = function(){
      var costo = parseFloat(STATE.precioCosto) || 0;
      var margen = parseFloat(STATE.precioMargen) || 0;
      var precio = costo * (1 + margen/100);
      var ganancia = precio - costo;
      STATE.precioResult = {precio: precio.toFixed(2), costo: costo.toFixed(2), ganancia: ganancia.toFixed(2)};
      unlockAchievement('first_calc');
      render();
    };
  }

  // Calc ganancia
  var calcGananciaBtn = document.getElementById('calcGananciaBtn');
  if(calcGananciaBtn){
    var gp = document.getElementById('ganPrecio');
    var gc = document.getElementById('ganCosto');
    var gu = document.getElementById('ganUnidades');
    if(gp) gp.oninput = function(){ STATE.ganPrecio = gp.value; };
    if(gc) gc.oninput = function(){ STATE.ganCosto = gc.value; };
    if(gu) gu.oninput = function(){ STATE.ganUnidades = gu.value; };
    calcGananciaBtn.onclick = function(){
      var precio = parseFloat(STATE.ganPrecio) || 0;
      var costo = parseFloat(STATE.ganCosto) || 0;
      var unidades = parseFloat(STATE.ganUnidades) || 0;
      var porUnidad = precio - costo;
      var total = porUnidad * unidades;
      var margen = precio>0 ? ((porUnidad/precio)*100).toFixed(1) : '0.0';
      STATE.ganResult = {total: total.toFixed(2), porUnidad: porUnidad.toFixed(2), margen: margen};
      unlockAchievement('first_calc');
      render();
    };
  }

  // Herramientas subtabs
  document.querySelectorAll('[data-herr-sub]').forEach(function(el){
    el.onclick = function(){
      STATE.herrSub = el.getAttribute('data-herr-sub');
      render();
    };
  });

  // Checklist
  document.querySelectorAll('[data-check-id]').forEach(function(el){
    el.onclick = function(){
      var id = parseInt(el.getAttribute('data-check-id'));
      var item = STATE.checklist.find(function(c){return c.id===id;});
      if(item){
        item.done = !item.done;
        persistAll();
        if(STATE.checklist.every(function(c){return c.done;})){
          unlockAchievement('checklist_done');
          showToast('🎉 Checklist completata!');
        }
        render();
      }
    };
  });
  var resetChecklist = document.getElementById('resetChecklist');
  if(resetChecklist){
    resetChecklist.onclick = function(){
      STATE.checklist = defaultChecklist();
      persistAll();
      render();
    };
  }

  // Shopping list
  var shopAdd = document.getElementById('shopAdd');
  var shopInput = document.getElementById('shopInput');
  function addShopItem(){
    if(!shopInput || shopInput.value.trim()==='') return;
    STATE.shopping.push({id: Date.now(), text: shopInput.value.trim(), done:false});
    persistAll();
    if(STATE.shopping.length>=5) unlockAchievement('shopping5');
    render();
    var ni = document.getElementById('shopInput');
    if(ni) ni.focus();
  }
  if(shopAdd) shopAdd.onclick = addShopItem;
  if(shopInput) shopInput.onkeydown = function(e){ if(e.key==='Enter') addShopItem(); };

  document.querySelectorAll('[data-shop-id]').forEach(function(el){
    el.onclick = function(e){
      if(e.target.closest('[data-shop-del]')) return;
      var id = parseInt(el.getAttribute('data-shop-id'));
      var item = STATE.shopping.find(function(s){return s.id===id;});
      if(item){ item.done = !item.done; persistAll(); render(); }
    };
  });
  document.querySelectorAll('[data-shop-del]').forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      var id = parseInt(el.getAttribute('data-shop-del'));
      STATE.shopping = STATE.shopping.filter(function(s){return s.id!==id;});
      persistAll();
      render();
    };
  });

  // Diary
  var diaryAdd = document.getElementById('diaryAdd');
  if(diaryAdd){
    diaryAdd.onclick = function(){
      var title = document.getElementById('diaryTitle').value.trim();
      var text = document.getElementById('diaryText').value.trim();
      if(title==='' && text==='') return;
      var now = new Date();
      var dateStr = now.toLocaleDateString('it-IT', {day:'2-digit',month:'short',year:'numeric'});
      STATE.diary.push({id:Date.now(), title: title || 'Senza titolo', text: text, date: dateStr});
      persistAll();
      unlockAchievement('first_diary');
      showToast('📓 Nota salvata');
      document.getElementById('diaryTitle').value='';
      document.getElementById('diaryText').value='';
      render();
    };
  }
  document.querySelectorAll('[data-diary-del]').forEach(function(el){
    el.onclick = function(){
      var id = parseInt(el.getAttribute('data-diary-del'));
      STATE.diary = STATE.diary.filter(function(d){return d.id!==id;});
      persistAll();
      render();
    };
  });

  // Perfil: tabbed info (ventas/conserv/empaque)
  document.querySelectorAll('[data-info-tab]').forEach(function(el){
    el.onclick = function(){
      var parts = el.getAttribute('data-info-tab').split(':');
      var section = parts[0], idx = parseInt(parts[1]);
      if(section==='ventas') STATE.ventasTab = idx;
      else if(section==='conserv') STATE.conservTab = idx;
      else if(section==='empaque') STATE.empaqueTab = idx;
      render();
    };
  });
}

/* =========================================================
   INIT
========================================================= */
render();

</script>
</body>
</html>
